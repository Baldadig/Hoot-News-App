<!doctype html><html lang="nl"><meta charset="utf-8"><title>Hoot · lokale updateproef</title><style>body{font:16px system-ui;margin:24px}button{padding:12px;margin:8px}iframe{width:100%;height:660px;border:1px solid #888}pre{white-space:pre-wrap}</style><h1>Lokale updateproef</h1><p>Uitsluitend synthetische gegevens op localhost. Geen echte sessie of account.</p><button id="seed">Bewaar proefgegevens</button><button id="open">Open app</button><button id="check">Controleer workerupdate</button><button id="next">Volgende laadbeurt</button><button id="proof">Lees proefuitkomst</button><pre id="result" aria-live="polite"></pre><div id="host"></div><script>
const [seed,open,check,next,proof,result,host]=['seed','open','check','next','proof','result','host'].map(id=>document.getElementById(id));
const keys=['hoot:prefs','hoot:saved-v2','hoot:read'];let frame;
const snapshot=()=>Object.fromEntries(keys.map(k=>[k,JSON.parse(localStorage.getItem(k)||'null')]));
seed.onclick=()=>{localStorage.setItem('hoot:prefs',JSON.stringify({schema:3,onboarded:true,theme:'dark',themeDark:'night',interests:['tech'],muted:[],pinned:[],bluesky:true,bskyInStream:['bsky:hoot-proef.invalid'],social:[{handle:'hoot-proef.invalid',name:'Hoot-proefprofiel'}]}));localStorage.setItem('hoot:saved-v2',JSON.stringify({'proef-sw':{id:'proef-sw',title:'Mijn bewaarde proefstuk',source:'nos',url:'https://example.test/proef'}}));localStorage.setItem('hoot:read',JSON.stringify(['proef-sw-gelezen']));result.textContent=JSON.stringify(snapshot(),null,2)};
open.onclick=()=>{frame=document.createElement('iframe');frame.title='Hoot appversie';frame.src='/lees/';host.replaceChildren(frame)};
check.onclick=async()=>{const r=await navigator.serviceWorker.getRegistration('/lees/');if(r)await r.update();result.textContent='Workerupdate gecontroleerd; open app blijft staan.'};
next.onclick=()=>{frame.src='/lees/?load='+Date.now()};
proof.onclick=async()=>{const r=await navigator.serviceWorker.getRegistration('/lees/');result.textContent=JSON.stringify({release:await(await fetch('/__release')).text(),storage:snapshot(),worker:r?{active:r.active?.state,waiting:r.waiting?.state||null,installing:r.installing?.state||null}:null,appScripts:[...frame.contentDocument.querySelectorAll('script[src]')].map(s=>s.getAttribute('src')),numbers:frame.contentDocument.querySelectorAll('.kicker__n').length,localDataPresent:!!snapshot()['hoot:saved-v2']?.['proef-sw']&&snapshot()['hoot:read']?.includes('proef-sw-gelezen')&&snapshot()['hoot:prefs']?.themeDark==='night'},null,2)};
</script></html>

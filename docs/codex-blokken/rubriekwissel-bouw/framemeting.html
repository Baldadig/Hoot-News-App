<!doctype html><meta charset="utf-8"><title>Hoot · themaproef</title><style>body{font:18px system-ui}button{padding:12px;margin:8px}iframe{width:390px;height:844px;border:0}</style><button id="light">Licht</button><button id="dark">Donker</button><button id="night">Nacht</button><button id="before">Voor de wijziging</button><button id="after">Na de wijziging</button><button id="proof">Lees framemeting</button><pre id="result"></pre><iframe title="Hoot proefapp" id="app"></iframe><script>
let prefix='/lees/';let frames=[];const frame=document.getElementById('app');
frame.addEventListener('load',()=>{const d=frame.contentDocument;d.addEventListener('click',e=>{if(!e.target.closest('.rub__btn'))return;frames=[];const start=performance.now();function measure(){const stage=d.querySelector('.rubriek-stage'),head=d.querySelector('.view:not([hidden]) .viewhead');if(stage){const bar=d.querySelector('.rub__bar'),r=stage.getBoundingClientRect(),v=d.querySelector('.view:not([hidden])').getBoundingClientRect();frames.push({ms:performance.now()-start,animations:d.getAnimations().map(a=>({duration:a.effect?.getComputedTiming().duration,target:a.effect?.target?.className,opacity:getComputedStyle(a.effect.target).opacity})),ghosts:d.querySelectorAll('.rubriek-stage__old').length,stageTop:r.top,view:[v.top,v.height],images:[...stage.querySelectorAll('img')].map(i=>({ready:i.complete&&i.naturalWidth>0,h:i.getBoundingClientRect().height})),first:stage.querySelector('[data-id]')?.dataset.id,indicator:bar?getComputedStyle(bar).transitionDuration:null})}if(performance.now()-start<1200)requestAnimationFrame(measure)}requestAnimationFrame(measure)},true)});document.getElementById('proof').onclick=()=>document.getElementById('result').textContent=JSON.stringify(frames);
function open(theme){localStorage.setItem('hoot:prefs',JSON.stringify({schema:3,onboarded:true,theme,themeDark:theme==='night'?'night':'dark',interests:['binnenland','tech'],images:'aan',layout:'tijdlijn',muted:[],bluesky:false}));document.getElementById('app').src=prefix+'?proef='+theme+'#/stroom'};for(const t of ['light','dark','night'])document.getElementById(t).onclick=()=>open(t);document.getElementById('before').onclick=()=>{prefix='/before/lees/';open('night')};document.getElementById('after').onclick=()=>{prefix='/lees/';open('night')};open('light');</script>

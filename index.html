<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hoot — je nieuws in één rustige editie</title>
    <meta name="description" content="Je nieuwsbronnen in één rustige editie: drie keer per dag tien verhalen, in een minuut samengevat. Minder scrollen, meer lezen." />
    <link rel="canonical" href="https://hootnews.nl/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hoot" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:url" content="https://hootnews.nl/" />
    <meta property="og:title" content="Hoot — je nieuws in één rustige editie" />
    <meta property="og:description" content="Drie keer per dag tien verhalen uit je eigen nieuwsbronnen, in een minuut samengevat. Minder scrollen, meer lezen." />
    <meta property="og:image" content="https://hootnews.nl/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="hoot. — als krantenkop" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Kleur van de statusbalk/browserbalk: het papier van het thema (wordt bij wisselen bijgewerkt). -->
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)" />
    <!-- De berichten alvast ophalen terwijl de app zelf nog laadt. -->
    <link rel="preload" href="/api/feed?deel=start" as="fetch" crossorigin="anonymous" />
    <!-- Bronlogo's en Bluesky-avatars komen hiervandaan: de verbinding alvast openen. -->
    <link rel="preconnect" href="https://cdn.bsky.app" />
    <script>
      // Terugkerend bezoek aan de Editie: het hoofdbeeld van de vorige keer alvast ophalen
      // (alleen als dat recent was — een editie blijft een halve dag staan).
      (function () {
        try {
          var h = location.hash
          if (h && h !== '#/' && h.indexOf('#/editie') !== 0) return
          var l = JSON.parse(localStorage.getItem('hoot:lcp') || 'null')
          // Alleen https-adressen of de eigen beeld-CDN; andere relatieve paden niet.
          if (!l || !l.u || Date.now() - l.at > 12 * 60 * 60 * 1000 || !/^(https:\/\/|\/\.netlify\/images\?)/.test(l.u)) return
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = l.u
          link.referrerPolicy = 'no-referrer'
          link.fetchPriority = 'high'
          document.head.appendChild(link)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="alternate icon" href="/icons/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": op het beginscherm staat de app onder de statusbalk en kleurt de klok mee met de
         achtergrond. ("black-translucent" gaf witte tijd op het lichte papier: onleesbaar.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hoot" />
    <script>
      // Zet thema en kleur vóór render (geen flits): voorkeur uit localStorage, 'system' volgt het OS.
      (function () {
        try {
          var p = localStorage.getItem('hoot:theme') || 'system'
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var k = (JSON.parse(localStorage.getItem('hoot:prefs') || '{}') || {}).palette
          if (k === 'blad' || k === 'inkt') document.documentElement.dataset.palette = k
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

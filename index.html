<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hoot</title>
    <meta name="description" content="Een rustige, reclamevrije nieuws-tijdlijn van jouw abonnementen." />
    <!-- Kleur van de statusbalk/browserbalk: het papier van het thema (wordt bij wisselen bijgewerkt). -->
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />
    <!-- De berichten alvast ophalen terwijl de app zelf nog laadt. -->
    <link rel="preload" href="/api/feed" as="fetch" crossorigin="anonymous" />
    <script>
      // Terugkerend bezoek aan de Editie: het hoofdbeeld van de vorige keer alvast ophalen
      // (alleen als dat recent was — een editie blijft een halve dag staan).
      (function () {
        try {
          var h = location.hash
          if (h && h !== '#/' && h.indexOf('#/editie') !== 0) return
          var l = JSON.parse(localStorage.getItem('hoot:lcp') || 'null')
          if (!l || !l.u || Date.now() - l.at > 12 * 60 * 60 * 1000 || !/^https:\/\//.test(l.u)) return
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = l.u
          link.referrerPolicy = 'no-referrer'
          link.fetchPriority = 'high'
          document.head.appendChild(link)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": op het beginscherm staat de app onder de statusbalk en kleurt de klok mee met de
         achtergrond. ("black-translucent" gaf witte tijd op het lichte papier: onleesbaar.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hoot" />
    <script>
      // Zet het thema vóór render (geen flits): voorkeur uit localStorage, 'system' volgt het OS.
      (function () {
        try {
          var p = localStorage.getItem('hoot:theme') || 'system'
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

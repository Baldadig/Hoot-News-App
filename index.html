    <title>Hoot — je nieuws in één rustige editie</title>

    <meta property="og:description" content="Drie keer per dag tien verhalen uit je eigen nieuwsbronnen. Minder scrollen, meer lezen." />
    <meta property="og:image" content="https://gethoot.app/lees/og.png" />

    <meta property="og:image:height" content="630" />

    <!-- Kleur van de statusbalk/browserbalk: het papier van het thema (wordt bij wisselen bijgewerkt). -->
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)" />
    <!-- De berichten alvast ophalen terwijl de app zelf nog laadt. -->
    <link rel="preload" href="/api/feed?deel=start" as="fetch" crossorigin="anonymous" />
    <!-- Bronlogo's en Bluesky-avatars komen hiervandaan: de verbinding alvast openen. -->
    <link rel="preconnect" href="https://cdn.bsky.app" />
    <script>
      // Terugkerend bezoek aan de Editie: het hoofdbeeld van de vorige keer alvast ophalen
      // (alleen als dat recent was — een editie blijft een halve dag staan).
      (function () {
        try {
          var h = location.hash
          if (h && h !== '#/' && h.indexOf('#/editie') !== 0) return
          var l = JSON.parse(localStorage.getItem('hoot:lcp') || 'null')
          // Alleen https-adressen of de eigen beeld-CDN; andere relatieve paden niet.
          if (!l || !l.u || Date.now() - l.at > 12 * 60 * 60 * 1000 || !/^(https:\/\/|\/\.netlify\/images\?)/.test(l.u)) return
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = l.u
          link.referrerPolicy = 'no-referrer'
          link.fetchPriority = 'high'
          document.head.appendChild(link)
        } catch (e) {}
      })()
    </script>
    <!-- Opstartscherm (koude start, en op het beginscherm bij elke start): merkrood met het woordmerk
         in papier en de stuiterende punt, al vóór de app en styles.css er zijn. Daarom staan deze
         regels hier en niet in styles.css: maten uit LaunchMark/SplashView.swift (160 × 49, de punt
         r 7,7 op (231,75; 65,8) in de tekening), één sprong 1,6 s (y −9/0/−2/0 pt, deuk 1,12 × 0,88
         vanaf de onderkant), in eenheden van de tekening (× 239,45/160). src/components/Splash.jsx
         neemt het over: wachten tot de Editie er is, dan de iris of de landing (lib/motion.js). -->
    <style>
      .splash {
        --brand-red: #a3201b;
        --paper-brand: #f5f1e8;
        position: fixed;
        inset: 0;
        z-index: var(--z-splash, 90);
        display: grid;
        place-items: center;
        background: var(--brand-red);
        will-change: clip-path;
      }
      .splash[hidden] {
        display: none;
      }
      .splash__mark {
        width: 160px;
        height: 49px;
        color: var(--paper-brand);
        will-change: transform;
      }
      .splash__mark svg {
        display: block;
        fill: currentColor;
      }
      .splash__hop,
      .splash__dot {
        transform-box: fill-box;
      }
      .splash__hop {
        animation: splash-hop 1.6s infinite;
      }
      .splash__dot {
        transform-origin: 50% 100%;
        animation: splash-squash 1.6s infinite;
      }
      /* De sprong: omhoog dat afremt, omlaag dat versnelt, een na-veertje, dan 0,54 s stil. */
      @keyframes splash-hop {
        0% { transform: translateY(0); animation-timing-function: ease-out; }
        26.25% { transform: translateY(-13.47px); animation-timing-function: ease-in; }
        48.75% { transform: translateY(0); animation-timing-function: ease-out; }
        57.5% { transform: translateY(-2.99px); animation-timing-function: ease-in; }
        66.25%, 100% { transform: translateY(0); }
      }
      /* De deuk: iets smaller bij het afzetten, breed en plat bij het landen. */
      @keyframes splash-squash {
        0% { transform: scale(1, 1); animation-timing-function: ease-out; }
        12.5% { transform: scale(0.96, 1.04); animation-timing-function: linear; }
        26.25% { transform: scale(1, 1); animation-timing-function: ease-in; }
        45% { transform: scale(0.97, 1.03); animation-timing-function: linear; }
        48.75% { transform: scale(1.12, 0.88); animation-timing-function: ease-out; }
        58.75%, 100% { transform: scale(1, 1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__hop,
        .splash__dot {
          animation: none;
        }
      }
    </style>
    <link rel="icon" href="/lees/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="alternate icon" href="/lees/icons/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/lees/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": op het beginscherm staat de app onder de statusbalk en kleurt de klok mee met de
         achtergrond. ("black-translucent" gaf witte tijd op het lichte papier: onleesbaar.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hoot" />
    <script>
      // Zet thema en kleur vóór render (geen flits): voorkeur uit localStorage, 'system' volgt het OS.
      (function () {
        try {
          var p = localStorage.getItem('hoot:theme') || 'system'
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var k = (JSON.parse(localStorage.getItem('hoot:prefs') || '{}') || {}).palette
          if (k === 'blad' || k === 'inkt') document.documentElement.dataset.palette = k
        } catch (e) {}
      })()
    </script>

    </div>
    <script>
      // Alleen bij een koude lading (nog geen vlag in deze sessie) en op het beginscherm bij elke
      // start, zoals de app. Zolang het staat, kleurt de browserbalk merkrood (Splash.jsx zet hem terug).
      (function () {
        var s = document.getElementById('splash')
        try {
          var home = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true
          if (!home && sessionStorage.getItem('hoot:splashed')) return s.remove()
          sessionStorage.setItem('hoot:splashed', '1')
        } catch (e) {
          /* geen sessionStorage: dan één keer tonen */
        }
        s.removeAttribute('hidden')
        s.dataset.at = String(performance.now())
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#a3201b')
          m.removeAttribute('media')
        })
      })()
    </script>

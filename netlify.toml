[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# De API-routes (/api/feed, /api/tts, /api/save) staan in de functies zelf (export const config).

# Beeld op maat (AVIF/WebP) via de beeld-CDN van Netlify, alleen van deze bronnen.
# Moet gelijk lopen met CDN_HOSTS in src/lib/img.js (tests/img.test.mjs controleert dat).
[images]
  remote_images = [
    'https://images\.nrc\.nl/.*',
    'https://i\.guim\.co\.uk/.*',
    'https://cdn\.theatlantic\.com/.*',
    'https://images\.vpro\.nl/.*',
    'https://thequietus\.com/.*',
    'https://lede-admin\.stereogum\.com/.*',
    'https://ichef\.bbci\.co\.uk/.*',
    'https://npr\.brightspotcdn\.com/.*',
    'https://images\.ft\.com/.*',
    'https://oor\.nl/.*',
    'https://oor-prod\.slashsmart\.com/.*',
  ]

# Eén adres: het oude Netlify-adres stuurt door naar hootnews.nl (één opslag, één service
# worker, één inlogadres). Vóór de SPA-fallback, anders wint die.
[[redirects]]
  from = "https://hootnewsapp.netlify.app/*"
  to = "https://hootnews.nl/:splat"
  status = 301
  force = true

# SPA-fallback (laat de PWA alle routes afhandelen)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Bestanden met een hash in de naam veranderen nooit: een jaar bewaren.
# (index.html, sw.js en /api/feed blijven wél altijd vers.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Iconen en logo's wisselen zelden.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

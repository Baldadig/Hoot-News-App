[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Schone API-routes naar de serverless functies
[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/save"
  to = "/.netlify/functions/save"
  status = 200

# SPA-fallback (laat de PWA alle routes afhandelen)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Bestanden met een hash in de naam veranderen nooit: een jaar bewaren.
# (index.html, sw.js en /api/feed blijven wél altijd vers.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Iconen en logo's wisselen zelden.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "@resvg/resvg-js"]
  included_files = ["shared/deelkaart/**", "public/brand/hoot-logo-mono.svg"]

# De API-routes (/api/feed, /api/tts, /api/save) staan in de functies zelf (export const config).

# Beeld op maat (AVIF/WebP) via de beeld-CDN van Netlify, alleen van deze bronnen.
# Moet gelijk lopen met CDN_HOSTS in src/lib/img.js (tests/img.test.mjs controleert dat).
[images]
  remote_images = [
    'https://images\.nrc\.nl/.*',
    'https://i\.guim\.co\.uk/.*',
    'https://cdn\.theatlantic\.com/.*',
    'https://images\.vpro\.nl/.*',
    'https://thequietus\.com/.*',
    'https://lede-admin\.stereogum\.com/.*',
    'https://ichef\.bbci\.co\.uk/.*',
    'https://npr\.brightspotcdn\.com/.*',
    'https://images\.ft\.com/.*',
  ]

# De oorspronkelijke Netlify-URL gaat naar het nieuwe merkadres.
[[redirects]]
  from = "https://hootnewsapp.netlify.app/*"
  to = "https://gethoot.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/lees/#/privacy"
  status = 301

[[redirects]]
  from = "/over"
  to = "/lees/#/over"
  status = 301

[[redirects]]
  from = "/lees/*"
  to = "/lees/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Bestanden met een hash in de naam veranderen nooit: een jaar bewaren.
# (index.html, sw.js en /api/feed blijven wél altijd vers.)
[[headers]]
  for = "/lees/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Iconen en logo's wisselen zelden.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
